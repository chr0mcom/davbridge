# DAVbridge behind nginx - complete example (replaces /etc/nginx/nginx.conf).
#
# Replace dav.example.com and the certificate paths. The certificate must be publicly
# trusted and cover every host name that clients use (add autodiscover.dav.example.com to
# server_name and to the certificate only if you use Autodiscover on the e-mail domain).
#
# Assumes that nginx and the `davbridge` container share a Docker network, that nginx is
# the first proxy in front of DAVbridge, and that nginx's address is listed in DAVbridge's
# `server.trusted_proxies`.
#
# DO NOT add gzip, proxy caching, auth_request / auth_basic or captcha modules for these
# locations. DAVbridge authenticates every request itself.

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    gzip off;

    # Do not log Authorization headers or request bodies. Keep the access log minimal.
    log_format davbridge '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log davbridge;
    error_log  /var/log/nginx/error.log warn;

    # 20 requests/s with a burst of 60 per client IP. A full first synchronization
    # issues hundreds of requests; do not make this much stricter.
    limit_req_zone $binary_remote_addr zone=davbridge:10m rate=20r/s;

    # Docker's embedded DNS; lets nginx start even if the upstream is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name dav.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name dav.example.com;

        ssl_certificate     /etc/letsencrypt/live/dav.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dav.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        client_max_body_size 1m;

        # Only the protocol paths are routed. Matching is case-insensitive (~*).
        # /healthz and everything else stays internal.
        location ~* ^/(EWS/Exchange\.asmx|autodiscover/autodiscover\.(xml|json)(/.*)?|Microsoft-Server-ActiveSync/?)$ {
            limit_req zone=davbridge burst=60 nodelay;

            # A variable in proxy_pass makes nginx resolve the name at request time.
            set $davbridge_upstream http://davbridge:8000;
            proxy_pass $davbridge_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streaming (EWS) and long polling (EAS Ping) must not be buffered or compressed.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;

            # >= 1900 s for an 1800 s EWS stream and above the 540 s EAS Ping heartbeat.
            proxy_read_timeout 1900s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location / {
            return 404;
        }
    }
}
