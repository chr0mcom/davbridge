[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "davbridge"
version = "0.1.0"
description = "Calendar bridge that gives Outlook (EWS and Exchange ActiveSync 14.1) access to a CalDAV server"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "fastapi>=0.162,<0.163",
    "starlette>=1.3.1",
    "uvicorn>=0.32,<0.35",
    "httpx>=0.27,<0.29",
    "lxml>=6.1,<7",
    "icalendar>=6.1,<7",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
davbridge = "davbridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "davbridge.data" = "data"}
packages = [
    "davbridge",
    "davbridge.eas",
    "davbridge.eas.commands",
    "davbridge.operations",
    "davbridge.data",
]

[tool.setuptools.package-data]
"davbridge.data" = ["windowsZones.xml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src", "."]
markers = [
    "integration: needs a real CalDAV server (DAVBRIDGE_IT_* environment variables)",
]

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tools/**" = ["E501"]
"tools/eas_test_client.py" = ["E741"]
